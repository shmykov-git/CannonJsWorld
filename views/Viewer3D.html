<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        .floating-button {
            position: absolute;
            width: 60px;
            height: 60px;
            color: white;
            border: none;
            border-radius: 50%; /* Делаем кнопку круглой */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: center;
            z-index: 10; /* Кнопка находится поверх остальных элементов */
        }
        .control-button
        {
            background-color: rgba(0, 123, 255, 0.2);
        }
        .control-button:hover {
            background-color: #4d47ff;
        }
        .left-button {
            bottom: 30%;
            left: 10px;
        }
        .right-button {
            bottom: 30%;
            right: 10px;
        }

        .spin-right {
            animation: spinR 0.8s linear infinite;
        }
        .spin-left {
            animation: spinL 0.8s linear infinite;
        }

        @keyframes spinR {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spinL {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        .bg1-button
        {
            bottom: 10px;
            right: 75%;
            transform: translateX(50%);
            background-color: rgba(248, 248, 248, 0.5);
        }
        .bg2-button
        {
            bottom: 10px;
            right: 50%;
            transform: translateX(50%);
            background-color: rgba(128, 128, 128, 0.5);
        }
        .bg3-button
        {
            bottom: 10px;
            right: 25%;
            transform: translateX(50%);
            background-color: rgba(32, 32, 32, 0.5);
        }
    </style>
    <title>3D viewer</title>
</head>
<body>    
    <button class="floating-button control-button left-button" id="btnLeft" disabled="true">↩</button>
    <button class="floating-button control-button right-button" id="btnRight" disabled="true">↪</button>
    <button class="floating-button bg1-button" id="btnBg1"></button>
    <button class="floating-button bg2-button" id="btnBg2"></button>
    <button class="floating-button bg3-button" id="btnBg3"></button>
    <script type="module" src="../src/viewsJs/Viewer3D.js"></script>
</body>
</html>
