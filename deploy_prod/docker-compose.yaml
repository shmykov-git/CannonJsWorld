services:

  nginx: #80, 443
    container_name: nginx
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /var/www/dehydrated:/var/www/dehydrated
      - /etc/dehydrated/certs:/etc/dehydrated/certs:ro
      - /var/www/html:/var/www/html
    ports:
      - 80:80
      - 443:443
    networks:
      - prod-site-net

  cannonworld: #3333
    container_name: cannonworld
    image: cannonworldimage
    restart: unless-stopped
    build:
      context: ..
    ports:
      - "3333:3333"
    networks:
      - prod-site-net

networks:
  prod-site-net:
