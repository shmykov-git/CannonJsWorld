events {}

http {
    upstream cannonworld {
        server cannonworld:3333;
    }

    upstream callsapi {
        server callsapi:5000;
    }

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;
    resolver 8.8.8.8;
    merge_slashes on;
    server_tokens off;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    gzip on;
    gzip_comp_level 4;

    map $http_upgrade $connection_upgrade {
        default Upgrade;
        '' close;
    }
        
    ### domain certificate check ###
    server {
        listen 80;
        server_name cannon.programbus.ru www.cannon.programbus.ru andrew.programbus.ru www.andrew.programbus.ru;

        location /check {
            add_header Content-Type text/plain;
            return 200 'alive\n';
        }

        location ^~ /.well-known/acme-challenge/ {
            alias /var/www/dehydrated/;
            try_files $uri =404;
        }    

        location / {
            return 301 https://$host$request_uri;
        }
    }

    ## run vitesite ###
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name cannon.programbus.ru www.cannon.programbus.ru andrew.programbus.ru www.andrew.programbus.ru;

        ssl_certificate     /etc/dehydrated/certs/cannon.programbus.ru/fullchain.pem;
        ssl_certificate_key /etc/dehydrated/certs/cannon.programbus.ru/privkey.pem;
        
        keepalive_timeout   70;
        add_header Strict-Transport-Security 'max-age=604800';
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

        if ($http_user_agent ~* SemrushBot|MJ12bot|AhrefsBot|bingbot|DotBot|PetalBot|LinkpadBot|SputnikBot|statdom.ru|MegaIndex.ru|WebDataStats|Jooblebot|Baiduspider|BackupLand|NetcraftSurveyAgent|openstat.ru) {
            return 444;
            }

        location /check {
            add_header Content-Type text/plain;
            return 200 'alive\n';
        }

        location /checkhost {
            add_header Content-Type text/plain;
            return 200 $host;
        }

        location  / {
            set $backend none;

            if ($host = andrew.programbus.com) {
                set $backend callsapi;
            }

            if ($host = www.andrew.programbus.com) {
                set $backend callsapi;
            }

            if ($host = cannonworld.programbus.com) {
                set $backend cannonworld;
            }

            if ($host = www.cannonworld.programbus.com) {
                set $backend cannonworld;
            }

            if ($backend = none) {
                return 404;
            }
            
            proxy_pass http://$backend$request_uri;
        }
    }    
}
