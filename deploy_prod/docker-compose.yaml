services:

  nginx: #80, 443
    container_name: nginx
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /var/www/dehydrated:/var/www/dehydrated
      - /etc/dehydrated/certs:/etc/dehydrated/certs:ro
    ports:
      - 80:80
      - 443:443
    networks:
      - prod-site-net

  cannonworld: #3333
    container_name: cannonworld
    image: cannonworldimage
    build:
      context: ..
    ports:
      - "3333:3333"
    networks:
      - prod-site-net

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
    
networks:
  prod-site-net:
