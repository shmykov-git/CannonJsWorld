events {}

http {
    upstream cannonworld {
        server cannonworld:3333;
    }

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;
    resolver 8.8.8.8;
    merge_slashes on;
    server_tokens off;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    gzip on;
    gzip_comp_level 4;

    map $http_upgrade $connection_upgrade {
        default Upgrade;
        '' close;
    }

    map $host $backend {
        cannon.programbus.ru        cannonworld;
        www.cannon.programbus.ru    cannonworld;
        default                     none;
    }

    ### domain certificate check ###
    server {
        listen 80;
        server_name cannon.programbus.ru www.cannon.programbus.ru alexey-shmykov.programbus.ru www.alexey-shmykov.programbus.ru;

        location /check {
            add_header Content-Type text/plain;
            return 200 'alive\n';
        }

        location ^~ /.well-known/acme-challenge/ {
            alias /var/www/dehydrated/;
            try_files $uri =404;
        }    

        location / {
            return 301 https://$host$request_uri;
        }
    }

    ## run vitesite ###
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name cannon.programbus.ru www.cannon.programbus.ru;

        ssl_certificate     /etc/dehydrated/certs/cannon.programbus.ru/fullchain.pem;
        ssl_certificate_key /etc/dehydrated/certs/cannon.programbus.ru/privkey.pem;
        
        keepalive_timeout   70;
        add_header Strict-Transport-Security 'max-age=604800';
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        
        if ($http_user_agent ~* SemrushBot|MJ12bot|AhrefsBot|bingbot|DotBot|PetalBot|LinkpadBot|SputnikBot|statdom.ru|MegaIndex.ru|WebDataStats|Jooblebot|Baiduspider|BackupLand|NetcraftSurveyAgent|openstat.ru) {
            return 444;
            }

        location /check {
            add_header Content-Type text/plain;
            return 200 'alive\n';
        }

        location  / {
            if ($backend = none) {
                return 404;
            }
            
            proxy_pass http://$backend$request_uri;
        }
    }    

    ## run cv ###
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name alexey-shmykov.programbus.ru www.alexey-shmykov.programbus.ru;

        ssl_certificate     /etc/dehydrated/certs/cannon.programbus.ru/fullchain.pem;
        ssl_certificate_key /etc/dehydrated/certs/cannon.programbus.ru/privkey.pem;
        
        keepalive_timeout   70;
        add_header Strict-Transport-Security 'max-age=604800';
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

        if ($http_user_agent ~* SemrushBot|MJ12bot|AhrefsBot|bingbot|DotBot|PetalBot|LinkpadBot|SputnikBot|statdom.ru|MegaIndex.ru|WebDataStats|Jooblebot|Baiduspider|BackupLand|NetcraftSurveyAgent|openstat.ru) {
            return 444;
            }

        location /check {
            add_header Content-Type text/plain;
            return 200 'alive cv\n';
        }

        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot|pdf|txt)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Основной location - исправленный
        location / {
            root /var/www/html;
            try_files /index.html;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }        
}
