services:

  nginx: #80, 443
    container_name: nginx
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /var/www/dehydrated:/var/www/dehydrated
      - /etc/dehydrated/certs:/etc/dehydrated/certs:ro
    ports:
      - 80:80
      - 443:443
    networks:
      - calls-network
      - prod-site-net

  cannonworld: #3333
    container_name: cannonworld
    image: cannonworldimage
    restart: unless-stopped
    build:
      context: ..
    ports:
      - "3333:3333"
    networks:
      - prod-site-net

  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbs
    restart: unless-stopped
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    volumes:
      - ./data:/root
    command: ["hbbs", "-r", "90.156.252.135", "--key", "_"]
    environment:
      - RUST_LOG=debug
      - KEY=qhvuILEFbicMiECweA+bycB4vLDopMv5SUw3W+QTb0g=
    networks:
      - rustdesk-net

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbr
    restart: unless-stopped
    ports:
      - "21117:21117"
      - "21119:21119"
    volumes:
      - ./data:/root
    command: ["hbbr", "--key", "_"]
    environment:
      - RUST_LOG=debug
      - KEY=qhvuILEFbicMiECweA+bycB4vLDopMv5SUw3W+QTb0g=
    networks:
      - rustdesk-net

  vpn:
    image: alekslitvinenk/openvpn
    container_name: vpn
    cap_add:
      - NET_ADMIN
    ports:
      - 1194:1194/udp
      - 8080:80
    environment:
      HOST_ADDR: "185.125.46.111"
    volumes:
      - ./dockovpn-data:/opt/Dockovpn_data
    restart: always
    networks:
      - vpn-net

networks:
  calls-network:
    driver: bridge
    external: true
    name: calls-network
  prod-site-net:
  vpn-net:
  rustdesk-net:
    driver: bridge
